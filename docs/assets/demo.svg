<text x="500.0" y="27" text-anchor="middle" fill="#8f8577" style="font-size:13.5px">your-repo — an agent at work, with Covenant</text>
<text class="l0" x="30" y="92" xml:space="preserve"><tspan fill="#e0684f" font-weight="600">$ </tspan><tspan fill="#f4efe6" font-weight="600">covenant compile </tspan><tspan fill="#c9bfae">&quot;don&#x27;t change public APIs, never force push,</tspan></text><text class="l1" x="30" y="120" xml:space="preserve"><tspan fill="#f4efe6">  </tspan><tspan fill="#c9bfae">never run destructive SQL, run tests before committing&quot;</tspan></text><text class="l2" x="30" y="148" xml:space="preserve"><tspan fill="#d9a95b" font-weight="600">  C1 </tspan><tspan fill="#f4efe6">api_surface_diff   </tspan><tspan fill="#d9a95b" font-weight="600">C2 </tspan><tspan fill="#f4efe6">command_guard   </tspan><tspan fill="#d9a95b" font-weight="600">C3 </tspan><tspan fill="#f4efe6">command_guard   </tspan><tspan fill="#d9a95b" font-weight="600">C4 </tspan><tspan fill="#f4efe6">trace_monitor</tspan></text><text class="l3" x="30" y="176" xml:space="preserve"><tspan fill="#e0684f" font-weight="600">$ </tspan><tspan fill="#f4efe6" font-weight="600">covenant init</tspan><tspan fill="#8f8577">   hooks installed, enforcing 4 rules</tspan></text><text class="l4" x="30" y="204" xml:space="preserve"><tspan fill="#c98bd6" font-weight="600">● </tspan><tspan fill="#c98bd6" font-weight="600">agent  </tspan><tspan fill="#f4efe6">git push --force origin main</tspan></text><text class="l5" x="30" y="232" xml:space="preserve"><tspan fill="#e0684f" font-weight="600">  ✕ refused  </tspan><tspan fill="#f4efe6">C2 never force push</tspan><tspan fill="#8f8577">  push normally, or ask the human</tspan></text><text class="l6" x="30" y="260" xml:space="preserve"><tspan fill="#c98bd6" font-weight="600">● </tspan><tspan fill="#c98bd6" font-weight="600">agent  </tspan><tspan fill="#f4efe6">psql -c &quot;DROP TABLE users&quot;</tspan></text><text class="l7" x="30" y="288" xml:space="preserve"><tspan fill="#e0684f" font-weight="600">  ✕ refused  </tspan><tspan fill="#f4efe6">C3 never run destructive SQL</tspan><tspan fill="#8f8577">  use a WHERE, or ask the human</tspan></text><text class="l8" x="30" y="316" xml:space="preserve"><tspan fill="#c98bd6" font-weight="600">● </tspan><tspan fill="#c98bd6" font-weight="600">agent  </tspan><tspan fill="#f4efe6">git commit -m &quot;add Table.pop&quot;</tspan></text><text class="l9" x="30" y="344" xml:space="preserve"><tspan fill="#e0684f" font-weight="600">  ✕ blocked  </tspan><tspan fill="#f4efe6">C4 run tests before committing</tspan><tspan fill="#8f8577">  no passing run since the last edit</tspan></text><text class="l10" x="30" y="372" xml:space="preserve"><tspan fill="#c98bd6" font-weight="600">● </tspan><tspan fill="#c98bd6" font-weight="600">agent  </tspan><tspan fill="#f4efe6">python -m pytest -q</tspan></text><text class="l11" x="30" y="400" xml:space="preserve"><tspan fill="#7fbf83" font-weight="600">  ✓ </tspan><tspan fill="#7fbf83">236 passed</tspan></text><text class="l12" x="30" y="428" xml:space="preserve"><tspan fill="#c98bd6" font-weight="600">● </tspan><tspan fill="#c98bd6" font-weight="600">agent  </tspan><tspan fill="#f4efe6">git commit -m &quot;add Table.pop&quot;</tspan></text><text class="l13" x="30" y="456" xml:space="preserve"><tspan fill="#7fbf83" font-weight="600">  ✓ allowed  </tspan><tspan fill="#f4efe6">every rule holds</tspan></text>
<rect class="cur" x="30" y="462" width="9" height="18" fill="#e0684f"/>
