(6px)}64.52%,94.13%{opacity:1;transform:none}97.65%,100%{opacity:0;transform:none}}.l11{animation:l11 17.05s linear infinite}@keyframes l12{0%,68.62%{opacity:0;transform:translateY(6px)}70.09%,94.13%{opacity:1;transform:none}97.65%,100%{opacity:0;transform:none}}.l12{animation:l12 17.05s linear infinite}@keyframes l13{0%,73.61%{opacity:0;transform:translateY(6px)}75.07%,94.13%{opacity:1;transform:none}97.65%,100%{opacity:0;transform:none}}.l13{animation:l13 17.05s linear infinite}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cur{animation:blink 1.1s steps(1) infinite}
