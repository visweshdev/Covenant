name: Covenant
description: Check a pull request against the repository's Covenant (rules for coding agents), and comment on the lines that break them.
branding:
  icon: shield
  color: purple

inputs:
  covenant:
    description: Path to the Covenant file
    default: covenant.yaml
  base:
    description: Base ref to compare against (default: the PR's target branch)
    default: ""
  run-tests:
    description: Run the Covenant's test commands on the PR
    default: "true"
  comment:
    description: Comment on the PR (inline on the lines that break a rule, plus one summary comment kept up to date). Needs `permissions: pull-requests: write`.
    default: "true"
  agent:
    description: Agent name for path ownership rules (COVENANT_AGENT)
    default: ""
  python-version:
    description: Python used to run Covenant
    default: "3.12"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}
    - name: Install Covenant
      shell: bash
      run: python -m pip install --quiet "${{ github.action_path }}"
    - name: Check the Covenant
      shell: bash
      env:
        # Inputs go through the environment, never pasted into the script.
        COVENANT_BASE: ${{ inputs.base || github.event.pull_request.base.sha }}
        COVENANT_FILE: ${{ inputs.covenant }}
        COVENANT_RUN_TESTS: ${{ inputs.run-tests }}
        COVENANT_COMMENT: ${{ inputs.comment }}
        COVENANT_AGENT: ${{ inputs.agent }}
        GITHUB_TOKEN: ${{ github.token }}
      run: |
        args=(--covenant "$COVENANT_FILE" ci --format github)
        if [ -n "$COVENANT_BASE" ]; then args+=(--base "$COVENANT_BASE"); fi
        if [ "$COVENANT_RUN_TESTS" != "true" ]; then args+=(--no-tests); fi
        if [ "$COVENANT_COMMENT" = "true" ]; then args+=(--comment); fi
        python -m covenant "${args[@]}"
