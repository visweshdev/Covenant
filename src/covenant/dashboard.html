<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Covenant Dashboard</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1b1f24; --muted: #5f6b7a; --line: #e3e7ec;
    --accent: #5b4bd6; --ok: #1f8a4c; --warn: #b26a00; --bad: #c62f3c; --chip: #eef0f4;
    --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --panel: #191d23; --ink: #e8ebef; --muted: #98a3b1; --line: #2a3038;
            --accent: #9d92ff; --ok: #4cc283; --warn: #e3a33a; --bad: #ff6b78; --chip: #232931; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 17px; margin: 0; letter-spacing: .2px; }
  header .sub { color: var(--muted); font-size: 13px; }
  header .live { margin-left: auto; color: var(--muted); font-size: 12px; }
  main { display: grid; grid-template-columns: 300px 1fr; gap: 16px; padding: 16px 20px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 820px) { main { grid-template-columns: 1fr; padding: 12px 16px; } }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  .list { padding: 6px; align-self: start; }
  .ws { display: block; width: 100%; text-align: left; border: 0; background: none; color: inherit; padding: 10px 12px; border-radius: 8px; cursor: pointer; font: inherit; }
  .ws:hover { background: var(--chip); }
  .ws.sel { background: var(--chip); box-shadow: inset 3px 0 0 var(--accent); }
  .ws .n { font-weight: 600; }
  .ws .m { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .detail { padding: 18px; min-width: 0; }
  h2 { font-size: 18px; margin: 0 0 2px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 22px 0 8px; }
  .path { color: var(--muted); font-family: var(--mono); font-size: 12px; word-break: break-all; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; margin-top: 14px; }
  .tile { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; }
  .tile .v { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .tile .k { color: var(--muted); font-size: 12px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .scroll { overflow-x: auto; }
  .chip { display: inline-block; padding: 1px 8px; border-radius: 999px; background: var(--chip); font-size: 12px; white-space: nowrap; }
  .chip.ok { color: var(--ok); } .chip.warn { color: var(--warn); } .chip.bad { color: var(--bad); }
  .bar { height: 6px; background: var(--chip); border-radius: 3px; min-width: 70px; margin-top: 6px; }
  .bar > i { display: block; height: 100%; border-radius: 3px; background: var(--warn); }
  .bar > i.full { background: var(--bad); }
  .mono { font-family: var(--mono); font-size: 12px; }
  .ev { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .ev:last-child { border-bottom: 0; }
  .ev .t { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
  .ev .hint { color: var(--muted); margin-top: 3px; }
  details summary { cursor: pointer; color: var(--muted); font-size: 12px; margin-top: 4px; }
  pre { background: var(--chip); padding: 8px; border-radius: 6px; overflow-x: auto; font-size: 12px; margin: 6px 0 0; }
  .empty { color: var(--muted); padding: 24px; text-align: center; }
  .err { color: var(--bad); }
</style>
</head>
<body>
<header>
  <h1>Covenant</h1>
  <span class="sub">rules enforced on coding agents, on this machine</span>
  <span class="live" id="live">loading…</span>
</header>
<main>
  <nav class="panel list" id="list" aria-label="Repositories"></nav>
  <section class="panel detail" id="detail"><div class="empty">Loading…</div></section>
</main>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const when = (iso) => iso ? new Date(iso).toLocaleString() : "—";
const ago = (iso) => {
  if (!iso) return "never";
  const s = Math.max(0, (Date.now() - new Date(iso)) / 1000);
  if (s < 60) return "just now";
  if (s < 3600) return `${Math.floor(s / 60)} min ago`;
  if (s < 86400) return `${Math.floor(s / 3600)} h ago`;
  return `${Math.floor(s / 86400)} d ago`;
};
let selected = decodeURIComponent(location.hash.slice(1)) || null;

async function getJSON(url) {
  const r = await fetch(url, { cache: "no-store" });
  const data = await r.json();
  if (!r.ok) throw new Error(data.error || r.statusText);
  return data;
}

function renderList(items) {
  if (!items.length) {
    $("list").innerHTML = '<div class="empty">No repos yet. Run <span class="mono">covenant init</span> in one.</div>';
    return;
  }
  if (!selected || !items.some((w) => w.id === selected)) selected = items[0].id;
  $("list").innerHTML = items.map((w) => {
    const blocks = Object.values(w.blocks).reduce((a, b) => a + b, 0);
    return `<button class="ws ${w.id === selected ? "sel" : ""}" data-id="${esc(w.id)}">
      <div class="n">${esc(w.name)}</div>
      <div class="m">${blocks ? `${blocks} block${blocks > 1 ? "s" : ""} · ` : ""}${w.events} event${w.events === 1 ? "" : "s"} · ${esc(ago(w.last_activity))}</div>
    </button>`;
  }).join("");
  for (const b of $("list").querySelectorAll("button")) {
    b.onclick = () => { selected = b.dataset.id; location.hash = encodeURIComponent(selected); refresh(); };
  }
}

function ruleState(c, blocks, limit) {
  if ((c.status || "enforced") !== "enforced") return `<span class="chip">${c.status === "unenforceable" ? "not checked" : "needs input"}</span>`;
  if (blocks >= limit) return '<span class="chip bad">handed to a human</span>';
  if (blocks) return '<span class="chip warn">has blocked the agent</span>';
  return '<span class="chip ok">no blocks</span>';
}

function evidenceLine(r) {
  const e = r.evidence || {};
  if (e.symbol && ("before" in e || "after" in e)) return e.after == null ? `${e.symbol} removed` : e.before == null ? `${e.symbol} added` : `${e.symbol}: ${e.before} → ${e.after}`;
  if (e.target) return `${e.op || e.operation || "changed"} ${e.target}${e.rolled_back ? " (restored)" : ""}`;
  if (e.problem) return `${e.path}: ${e.problem}`;
  if (Array.isArray(e.edits_since_last_passing_test)) return e.last_passing_test ? "edits since the last passing test" : "no passing test yet";
  return e.error || "";
}

function renderDetail(d) {
  const enforced = d.clauses.filter((c) => (c.status || "enforced") === "enforced").length;
  const totalBlocks = Object.values(d.block_counts).reduce((a, b) => a + b, 0);
  const escalated = Object.values(d.block_counts).filter((n) => n >= d.escalate_after).length;
  const rules = d.clauses.map((c) => {
    const n = d.block_counts[c.id] || 0;
    const pct = Math.min(100, (n / d.escalate_after) * 100);
    return `<tr>
      <td class="mono">${esc(c.id)}</td>
      <td>${esc(c.source_span)}${c.origin ? `<div class="path">from policy ${esc(c.origin)}</div>` : ""}</td>
      <td class="mono">${esc(c.checker || "—")}</td>
      <td>${ruleState(c, n, d.escalate_after)}<div class="bar" title="${n} of ${d.escalate_after} before handing over"><i class="${n >= d.escalate_after ? "full" : ""}" style="width:${pct}%"></i></div></td>
    </tr>`;
  }).join("");
  const timeline = [...d.recent_reports].reverse().slice(0, 60).map((e) => {
    const ids = [...new Set(e.reports.map((r) => r.violation))];
    const first = e.reports[0] || {};
    return `<div class="ev">
      <div><span class="t">${esc(when(e.ts))}</span> &nbsp;<b>${esc(e.event)}</b>
        ${e.allowed ? '<span class="chip">reported</span>' : '<span class="chip bad">refused</span>'}
        ${ids.map((i) => `<span class="chip">${esc(i)}</span>`).join(" ")}</div>
      <div class="hint">${esc(first.clause || "")}${evidenceLine(first) ? ` — ${esc(evidenceLine(first))}` : ""}</div>
      <details><summary>details</summary><pre>${esc(JSON.stringify(e.reports, null, 2))}</pre></details>
    </div>`;
  }).join("") || '<div class="empty">Nothing blocked in this task.</div>';
  const events = [...d.last_events].reverse().slice(0, 25).map((e) => {
    const what = e.path || e.cmd || e.target || e.sha || "";
    const status = e.type === "test" ? (e.exit_code === 0 ? '<span class="chip ok">passed</span>' : '<span class="chip bad">failed</span>') : "";
    return `<tr><td class="mono">${esc(new Date(e.ts).toLocaleTimeString())}</td><td>${esc(e.type)} ${status}</td><td class="mono">${esc(what)}</td></tr>`;
  }).join("");
  const protectedRows = d.protected.map((p) => `<tr><td class="mono">${esc(p.clause)}</td><td class="mono">${esc(p.paths.join(", "))}</td><td class="mono">${esc(p.exclude.join(", ") || "—")}</td></tr>`).join("");

  $("detail").innerHTML = `
    <h2>${esc(d.repo.split(/[\\/]/).pop())}</h2>
    <div class="path">${esc(d.repo)}</div>
    ${d.repo_covenant_changed ? '<p><span class="chip warn">covenant.yaml or a policy changed since approval; the approved version still applies</span></p>' : ""}
    <div class="tiles">
      <div class="tile"><div class="v">${enforced}</div><div class="k">rules enforced (${d.clauses.length} total)</div></div>
      <div class="tile"><div class="v">${d.trace_length}</div><div class="k">events this task</div></div>
      <div class="tile"><div class="v">${totalBlocks}</div><div class="k">blocks this task</div></div>
      <div class="tile"><div class="v">${escalated}</div><div class="k">rules handed to a human</div></div>
    </div>
    <div class="path" style="margin-top:8px">Task started ${esc(when(d.session.started_at))} · tests: ${esc(d.test_commands.join(", ") || "none declared")}</div>
    <h3>Rules</h3>
    <div class="scroll"><table><thead><tr><th>Id</th><th>Rule</th><th>Checker</th><th>This task</th></tr></thead><tbody>${rules}</tbody></table></div>
    <h3>Blocked and reported</h3>
    ${timeline}
    <h3>Recent events</h3>
    <div class="scroll"><table><thead><tr><th>Time</th><th>Event</th><th>Detail</th></tr></thead><tbody>${events || '<tr><td colspan="3" class="empty">No events yet.</td></tr>'}</tbody></table></div>
    ${protectedRows ? `<h3>Protected paths</h3><div class="scroll"><table><thead><tr><th>Rule</th><th>Paths</th><th>Excluded</th></tr></thead><tbody>${protectedRows}</tbody></table></div>` : ""}
  `;
}

async function refresh() {
  try {
    const items = await getJSON("/api/workspaces");
    renderList(items);
    if (selected) renderDetail(await getJSON(`/api/workspaces/${encodeURIComponent(selected)}`));
    else $("detail").innerHTML = '<div class="empty">Select a repository.</div>';
    $("live").textContent = `updated ${new Date().toLocaleTimeString()}`;
  } catch (err) {
    $("live").innerHTML = `<span class="err">${esc(err.message)}</span>`;
  }
}
refresh();
setInterval(refresh, 5000);
</script>
</body>
</html>
