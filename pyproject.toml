[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "covenant-agents"
version = "0.1.1"
description = "Compile plain-English instructions for coding agents into enforced contracts."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "viswesh-dev" }]
requires-python = ">=3.11"
keywords = ["coding agents", "ai safety", "policy", "claude code", "mcp", "guardrails"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = ["pydantic>=2.6", "pyyaml>=6", "anthropic>=2.3"]

[project.urls]
Homepage = "https://github.com/visweshdev/Covenant"
Repository = "https://github.com/visweshdev/Covenant"
Changelog = "https://github.com/visweshdev/Covenant/blob/main/CHANGELOG.md"
Issues = "https://github.com/visweshdev/Covenant/issues"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
covenant = "covenant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
covenant = ["verifiers/*.js", "*.html"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
