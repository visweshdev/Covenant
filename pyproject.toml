[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "covenant"
version = "0.1.0"
description = "Compile plain-English instructions for coding agents into enforced contracts."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6", "pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
covenant = "covenant.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
