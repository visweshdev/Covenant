name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install . ruff mypy types-PyYAML
      - run: ruff check --select F src tests scripts bench/measure_enforcement.py
      - run: ruff format --check src/covenant/git_archive.py scripts/verify_distribution.py tests/test_docker_sandbox.py tests/test_git_archive.py bench/measure_enforcement.py
      - run: mypy --follow-imports=silent src/covenant/ir.py src/covenant/events.py src/covenant/git_archive.py scripts/verify_distribution.py
      - run: python bench/measure_enforcement.py --check

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        shell: bash
        run: |
          python -m pip install -e ".[dev,anthropic]" pytest-cov
          npm install --prefix "$RUNNER_TEMP/ts" typescript@5.6.3
      - name: Test
        shell: bash
        env:
          COVENANT_TYPESCRIPT: ${{ runner.temp }}/ts/node_modules/typescript
        # Failures also become annotations, which anyone can read (job logs need admin rights).
        run: |
          set +e
          python -m pytest -q --tb=short -rfE --cov=covenant --cov-branch --cov-report=term-missing --cov-report=xml 2>&1 | tee pytest.log
          status=${PIPESTATUS[0]}
          grep -E "^(FAILED|ERROR) |^E  |^tests[/\\\\].*:[0-9]+: " pytest.log | head -40 | while IFS= read -r line; do
            echo "::error title=pytest::${line//%/%25}"
          done
          exit $status
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: coverage-${{ matrix.os }}-py${{ matrix.python }}
          path: coverage.xml

  sandbox:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      COVENANT_TEST_DOCKER: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q tests/test_docker_sandbox.py

  distribution:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build --wheel
      - shell: bash
        run: >-
          python scripts/verify_distribution.py covenant-agents==0.1.2
          --upgrade-from covenant-agents==0.1.1 --candidate dist/covenant_agents-*.whl

  extension:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: vscode-extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install ..
      - run: npm ci
      - run: npm test
      - run: xvfb-run -a npm run test:e2e
      - run: npm run package
