name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        shell: bash
        run: |
          python -m pip install -e ".[dev]"
          npm install --prefix "$RUNNER_TEMP/ts" typescript@5.6.3
      - name: Test
        shell: bash
        env:
          COVENANT_TYPESCRIPT: ${{ runner.temp }}/ts/node_modules/typescript
        run: python -m pytest -q
